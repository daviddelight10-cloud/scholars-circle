<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="color-scheme" content="dark" />
    
    <!-- Security headers are real HTTP headers in vercel.json —
         http-equiv metas for these are ignored by browsers -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    
    <!-- Primary Meta Tags -->
    <title>Scholar's Circle — Turn lecture PDFs into practice questions</title>
    <meta name="title" content="Scholar's Circle — Turn lecture PDFs into practice questions" />
    <meta name="description" content="Cram less, remember more. Upload your lecture PDFs, circle anything to ask AI, sit timed mock exams, and quiz friends live with voice. Built by MBBS students for medical & health-science students." />
    <meta name="keywords" content="medical student study app, MBBS exam prep, past questions Nigeria, AI study tutor, anatomy revision, pharmacy students, nursing exam prep, study with friends, live quiz" />
    <meta name="author" content="Scholar's Circle" />
    <link rel="canonical" href="https://scholarscircle.com.ng" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://scholarscircle.com.ng" />
    <meta property="og:title" content="Scholar's Circle — Turn lecture PDFs into practice questions" />
    <meta property="og:description" content="Circle anything in your notes to ask AI. Timed exam sims. Live quiz rooms with friends. Free forever — built by MBBS students." />
    <meta property="og:image" content="https://scholarscircle.com.ng/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:site_name" content="Scholar's Circle" />
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://scholarscircle.com.ng" />
    <meta property="twitter:title" content="Scholar's Circle — Turn lecture PDFs into practice questions" />
    <meta property="twitter:description" content="Circle anything in your notes to ask AI. Timed exam sims. Live quiz rooms with friends. Free forever — built by MBBS students." />
    <meta property="twitter:image" content="https://scholarscircle.com.ng/og-image.jpg" />
    
    <!-- iOS PWA Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Scholar's Circle" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icon-152.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/icon-167.png" />
    <!-- Apple Splash Screens (uses apple-touch-icon as fallback) -->
    
    <!-- Format Detection -->
    <meta name="format-detection" content="telephone=no" />
    
    <!-- Preload Critical Resources -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:wght@600;700&family=JetBrains+Mono:wght@400;600&family=Syne:wght@600;700;800&family=Sora:wght@600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png" />
    <link rel="shortcut icon" href="/icon-32.png" />
    
    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Scholar's Circle",
      "description": "Turn lecture PDFs into practice questions. Circle-to-Ask AI, timed exam simulations, live quiz rooms with friends, and smart review — built by MBBS students for medical & health-science students.",
      "applicationCategory": "EducationalApplication",
      "operatingSystem": "iOS, Android, Web",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "NGN"
      },
      "creator": {
        "@type": "Organization",
        "name": "Scholar's Circle",
        "foundingDate": "2024"
      }
    }
    </script>
  </head>
  <body>
    <style>
      :root {
        --sat: env(safe-area-inset-top);
        --sar: env(safe-area-inset-right);
        --sab: env(safe-area-inset-bottom);
        --sal: env(safe-area-inset-left);
      }
      
      html, body {
        margin: 0;
        padding: 0;
        /* iOS: do NOT position:fixed here — fixed descendants (the
           bottom nav portals to <body>) anchor to this box instead of
           the viewport, floating ~safe-area-height above the screen
           bottom and blocking Safari's bar collapse. overflow:hidden
           + viewport height locks the document without it. */
        overflow: hidden;
        width: 100%;
        height: 100%;
        /* iOS Safari: 100% on position:fixed can resolve to the small
           viewport; dvh tracks the real visible area incl. unsafe zones */
        height: -webkit-fill-available;
        height: 100dvh;
        overscroll-behavior-x: none;
        overscroll-behavior-y: none;
        /* Hard-coded ink: app controls its own theme (.dark/.light on
           <main>); the OS prefers-color-scheme must not repaint chrome */
        background: #0a0a0a;
      }

      #root {
        overflow-y: auto;
        height: 100%;
        height: -webkit-fill-available;
        height: 100dvh;
        overscroll-behavior: contain;
        background: #0a0a0a;
      }
    </style>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
